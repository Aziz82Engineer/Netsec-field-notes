#config-version=FGT50G-7.6.7-FW-build3704-260101:opmode=0:vdom=0:user=admin
#conf_file_ver=1
#buildno=3704
#global_vdom=1
config system global
    set hostname "LAB-FGT"
end
config firewall address
    edit "apple-probe"
        set type fqdn
        set fqdn "captive.apple.com"
    next
    edit "android-probe"
        set type fqdn
        set fqdn "connectivitycheck.gstatic.com"
    next
    edit "login.microsoftonline.com"
        set type fqdn
        set fqdn "login.microsoftonline.com"
    next
end
config firewall addrgrp
    edit "probe-group"
        set member "android-probe"
    next
end
config vpn certificate local
    edit "portal-cert"
        set password ENC dummy
        set certificate "-----BEGIN CERTIFICATE-----
