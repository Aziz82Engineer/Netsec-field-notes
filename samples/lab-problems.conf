config user saml
    edit "entra-portal"
        set entity-id "https://10.10.20.1:1003/remote/saml/metadata/"
        set single-sign-on-url "https://10.10.20.1:1003/remote/saml/login/"
        set single-logout-url "https://10.10.20.1:1003/remote/saml/logout/"
        set idp-entity-id "https://sts.windows.net/00000000-0000-0000-0000-000000000000/"
    next
end
config user security-exempt-list
    edit "guest-exempt"
        config rule
            edit 1
                set dstaddr "login.microsoftonline.com" "apple-probe" "probe-group"
            next
        end
    next
end
config wireless-controller vap
    edit "guest"
        set ssid "LAB-GUEST"
        set security captive-portal
        set security-exempt-list "guest-exempt"
        set security-redirect-url "https://www.example.com"
    next
end
config vpn ipsec phase1-interface
    edit "to-branch"
        set interface "wan1"
        set ike-version 2
        set peertype any
        set remote-gw 203.0.113.10
        set psksecret ENC dummy
    next
    edit "RA_VPN"
        set type dynamic
        set interface "wan1"
        set mode aggressive
        set peertype any
        set xauthtype auto
        set psksecret ENC dummy
    next
end
config vpn ipsec phase2-interface
    edit "to-branch-srv1"
        set phase1name "to-branch"
        set src-subnet 10.10.10.5 255.255.255.255
        set dst-subnet 172.16.5.11 255.255.255.255
    next
    edit "to-branch-srv2"
        set phase1name "to-branch"
        set src-subnet 10.10.10.5 255.255.255.255
        set dst-subnet 172.16.5.12 255.255.255.255
    next
    edit "to-branch-srv3"
        set phase1name "to-branch"
        set auto-negotiate enable
        set src-subnet 10.10.10.5 255.255.255.255
        set dst-subnet 172.16.5.13 255.255.255.255
    next
    edit "RA_VPN"
        set phase1name "RA_VPN"
    next
end
config router static
    edit 1
        set gateway 198.51.100.1
        set device "wan1"
    next
    edit 2
        set gateway 192.0.2.1
        set device "wan2"
    next
end
